name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend modules
        run: python -m py_compile main.py database.py models.py services/market_data.py
      - name: Initialise the SQLite schema
        run: python -c "from database import initialize_database; initialize_database(); print('SQLite schema initialized')"

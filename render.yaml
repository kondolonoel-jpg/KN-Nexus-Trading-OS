services:
  - type: web
    name: kn-nexus-trading-os
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/kn_nexus.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: COOKIE_SECURE
        value: "true"
      - key: TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: SECRET_KEY
        generateValue: true
      # Add the following private values from Render after choosing providers:
      # MARKET_DATA_API_URL / MARKET_DATA_API_KEY
      # ECONOMIC_CALENDAR_API_URL / ECONOMIC_CALENDAR_API_KEY
      # NEWS_API_URL / NEWS_API_KEY
      # AI_PROVIDER_API_KEY
    disk:
      name: kn-nexus-persistent-data
      mountPath: /var/data
      sizeGB: 1
